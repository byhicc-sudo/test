name: FOTON V18 Split Strips

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v18/split_strip_audit_v18.py'
      - '.github/workflows/foton-v18-split.yml'
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Split T1 COMB SCHEDULE audit
        run: |
          cd foton-v18
          python split_strip_audit_v18.py
