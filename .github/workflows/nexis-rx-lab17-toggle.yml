name: NEXIS-RX LAB17 same-binary FP on-off benchmark
on:
  push:
    branches:
      - nexis-rx-lab17-toggle
    paths:
      - "nexis_lab15/**"
      - ".github/workflows/nexis-rx-lab17-toggle.yml"
permissions:
  contents: read
jobs:
  exact-toggle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone and verify pinned RandomX v1.2.1
        run: |
          set -euo pipefail
          PIN=102f8acf90a7649ada410de5499a7ec62e49e1da
          git clone -q https://github.com/tevador/RandomX.git official
          git -C official checkout -q "$PIN"
          test "$(git -C official rev-parse HEAD)" = "$PIN"
          test "$(git hash-object official/src/bytecode_machine.hpp)" = 5e82e0d3713269ffd6bb1c37968af1e0150c9fa5
          test "$(git hash-object official/src/vm_interpreted.cpp)" = 64243c3ec3191a6927bdf0efd3501af2ffde1311
          cp -a official reference
          cp -a official legacy
          cp -a official alternative
          g++ -std=c++17 -O2 -Wall -Wextra -Werror nexis_lab15/patcher.cpp -o patcher
          ./patcher legacy legacy
          ./patcher alternative alternative
          echo "SOURCE_PIN_OK=$PIN"
      - name: Compile independent reference, legacy and toggle-capable C++ engines
        run: |
          set -euo pipefail
          for motor in reference legacy alternative; do
            cmake -S nexis_lab15 -B "build_$motor" -G Ninja -DRX_SRC="$PWD/$motor" -DCMAKE_BUILD_TYPE=Release -DARCH=native
            cmake --build "build_$motor" --target nexis_lab15 -j 2
          done
      - name: Official hash vectors in both runtime states
        run: |
          set -euo pipefail
          build_reference/nexis_lab15 vectors
          build_legacy/nexis_lab15 vectors
          env -u NEXIS_FP_ON build_alternative/nexis_lab15 vectors
          NEXIS_FP_ON=1 build_alternative/nexis_lab15 vectors
          echo "OFFICIAL_VECTORS_MATCH=20/20"
      - name: Three randomized-order paired same-binary benchmark rounds
        run: |
          set -euo pipefail
          mkdir -p output
          for rep in 1 2 3; do
            if [ "$rep" = 1 ]; then order="reference alternative_off legacy alternative_on"; fi
            if [ "$rep" = 2 ]; then order="alternative_on legacy alternative_off reference"; fi
            if [ "$rep" = 3 ]; then order="alternative_off reference alternative_on legacy"; fi
            for motor in $order; do
              case "$motor" in
                alternative_on) NEXIS_FP_ON=1 build_alternative/nexis_lab15 bench 64 > "output/$motor-$rep.txt" ;;
                alternative_off) env -u NEXIS_FP_ON build_alternative/nexis_lab15 bench 64 > "output/$motor-$rep.txt" ;;
                *) "build_$motor/nexis_lab15" bench 64 > "output/$motor-$rep.txt" ;;
              esac
              echo -n "MEASURE round=$rep motor=$motor "
              grep '^METRIC|' "output/$motor-$rep.txt"
            done
            for motor in legacy alternative_on alternative_off; do
              diff -u <(grep '^H|' "output/reference-$rep.txt") <(grep '^H|' "output/$motor-$rep.txt")
            done
            echo "EXACT_MATCH round=$rep all engines 64/64"
          done
          {
            echo "# Exact RandomX LAB17 same-binary parity-gate results"
            echo "source=102f8acf90a7649ada410de5499a7ec62e49e1da"
            echo "vectors=20/20"
            echo "hashes=192/192 per engine"
            for motor in reference legacy alternative_off alternative_on; do
              rates=$(for file in output/$motor-[123].txt; do grep '^METRIC|' "$file" | cut -d'|' -f4; done | sort -n)
              median=$(printf "%s\n" "$rates" | sed -n '2p')
              echo "$motor median_hps=$median"
            done
          } | tee output/SUMMARY.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexis-rx-lab17-toggle-results
          path: output/
          if-no-files-found: ignore
