name: NEXIS-RX LAB27 online ISTORE writeback exact RandomX and measured speed
on:
  push:
    branches: [nexis-rx-lab27-online-writeback-20261102]
    paths:
      - "nexis_rx_hist100/lab27_online_writeback.cpp"
      - ".github/workflows/nexis-rx-lab23-carry-constraints.yml"
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download 100 exact historical PoW blobs
        uses: actions/download-artifact@v4
        with:
          name: NEXIS_RX_100_EXACT_RANDOMX_POW
          repository: byhicc-sudo/test
          run-id: 41355345515
          github-token: ${{ github.token }}
          path: input/winners
      - name: Build pinned official RandomX with exact read-only dataset instrumentation
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev >/dev/null
          PIN=102f8acf90a7649ada410de5499a7ec62e49e1da
          git clone -q https://github.com/tevador/RandomX.git upstream
          git -C upstream checkout -q "$PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          python3 nexis_rx_hist100/lab27_patch_official.py upstream
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCH=native
          cmake --build build --target randomx -j 2
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -Wno-unused-parameter -Iupstream/src nexis_rx_hist100/lab27_online_writeback.cpp build/librandomx.a -pthread -o lab27
          echo NATIVE_CPP_BUILD=OK
      - name: Compare online ISTORE write combining to reference across 64 full hashes
        run: |
          set -euo pipefail
          mkdir -p output
          SEED=ede5e439528eee8366e06971e881221d3ff12a0b76152e4c462ca0642dce732d
          ./lab27 input/winners/computed100.csv "$SEED" output/SUMMARY.txt output/samples.csv | tee output/LOG.txt
          test "$(wc -l < output/samples.csv)" = 65
          grep -F 'COMPARED_OFFICIAL_FULL_RANDOMX_256BIT=64/64' output/SUMMARY.txt
          grep -F 'ONLINE_COALESCED_ISTORE=' output/SUMMARY.txt
          grep -F 'MEASURED_RATIO_DEFERRED_TO_DIRECT=' output/SUMMARY.txt
          cat output/SUMMARY.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload LAB27 exact online combining and speed benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXIS_RX_LAB27_ONLINE_WRITEBACK
          path: output/
          if-no-files-found: ignore
