name: NEXIS-RX LAB24 exact GF2 nonce derivative rank and nonlinearity
on:
  push:
    branches: [nexis-rx-lab24-nonce-jacobian-20261102]
    paths:
      - "nexis_rx_hist100/lab24_nonce_gf2_derivative.cpp"
      - ".github/workflows/nexis-rx-lab23-carry-constraints.yml"
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download 100 exact historical PoW blobs
        uses: actions/download-artifact@v4
        with:
          name: NEXIS_RX_100_EXACT_RANDOMX_POW
          repository: byhicc-sudo/test
          run-id: 41355345515
          github-token: ${{ github.token }}
          path: input/winners
      - name: Build pinned official RandomX reference and standalone inverse BLAKE2b audit
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev >/dev/null
          PIN=102f8acf90a7649ada410de5499a7ec62e49e1da
          git clone -q https://github.com/tevador/RandomX.git upstream
          git -C upstream checkout -q "$PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCH=native
          cmake --build build --target randomx -j 2
          g++ -std=c++17 -O3 -Wall -Wextra -Werror -Wno-unused-parameter -Iupstream/src nexis_rx_hist100/lab24_nonce_gf2_derivative.cpp build/librandomx.a -pthread -o lab24
          echo NATIVE_CPP_BUILD=OK
      - name: Measure exact GF2 nonce mapping and higher differences
        run: |
          set -euo pipefail
          mkdir -p output
          SEED=ede5e439528eee8366e06971e881221d3ff12a0b76152e4c462ca0642dce732d
          ./lab24 input/winners/computed100.csv "$SEED" output/SUMMARY.txt output/candidates.csv | tee output/LOG.txt
          test "$(wc -l < output/candidates.csv)" = 562
          grep -F 'ACTUAL_FULL_RANDOMX_HASHES=561 UNIQUE_NONCES=561' output/SUMMARY.txt
          grep -F 'NONCE_BIT_TO_TARGET_HIGH38_GF2_RANK=' output/SUMMARY.txt
          grep -F 'THIRD_DIFFERENCE_32_TRIPLES_NONZERO_TARGET_HIGH38=' output/SUMMARY.txt
          sha256sum output/SUMMARY.txt output/candidates.csv > output/SHA256.txt
          cat output/SUMMARY.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact GF2 derivative experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXIS_RX_LAB24_NONCE_GF2_DERIVATIVES
          path: output/
          if-no-files-found: ignore
