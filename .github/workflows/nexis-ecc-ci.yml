name: NEXIS ECC 64-bit bounded research

on:
  push:
    paths:
      - 'ecc-lab/**'
      - '.github/workflows/nexis-ecc-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-64-bit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Compile V24 native ECC engine
        run: |
          g++ -std=c++17 -O3 -Wno-deprecated-declarations ecc-lab/NEXIS_ECC_V24_RESUMABLE.cpp -lcrypto -o "$RUNNER_TEMP/nexis_v24"

      - name: Run bounded 64-bit kangaroo (NO 24-bit job)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/nexis_v24" \
            --bits 64 \
            --pub 02558650b3abe53dc236f53cc096a3f43ccbbe0c4a23480957608ebb6d1024198b \
            --seed 1 \
            --seconds 240 \
            --max-steps 25000000 \
            --checkpoint "$RUNNER_TEMP/nexis_64.chk" | tee "$RUNNER_TEMP/nexis_64.log"
          grep -q '^bits=64$' "$RUNNER_TEMP/nexis_64.log"
          grep -Eq '^status=(PAUSED|SOLVED)$' "$RUNNER_TEMP/nexis_64.log"
          if grep -q '^status=SOLVED$' "$RUNNER_TEMP/nexis_64.log"; then
            grep -q '^verification=PUBLIC_KEY_MATCH$' "$RUNNER_TEMP/nexis_64.log"
          fi

      - name: Preserve 64-bit log and resumable checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexis-ecc-64-bit-run
          path: |
            ${{ runner.temp }}/nexis_64.log
            ${{ runner.temp }}/nexis_64.chk
          retention-days: 7
          if-no-files-found: warn
