name: FOTON V29 Latent Rank Audit

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v29/**'
      - '.github/workflows/foton-v29.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python foton-v29/latent_rank_v29.py
