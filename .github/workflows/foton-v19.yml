name: FOTON V19 Slice Probe
on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v19/**'
      - '.github/workflows/foton-v19.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy quimb cotengra
      - run: cd foton-v19 && PYTHONPATH=../foton-v18 python slice_api_probe_v19.py
      - run: cd foton-v19 && PYTHONPATH=../foton-v18 python slice_plan_v19.py
