name: FOTON V21 Sigma Reversible MPO

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v21/**'
      - '.github/workflows/foton-v21.yml'
  workflow_dispatch:

jobs:
  sigma-mpo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Run reversible Sigma trellis MPO
        run: |
          export PYTHONPATH="$PWD/foton-v20:$PYTHONPATH"
          python foton-v21/sigma_reversible_mpo_v21.py
