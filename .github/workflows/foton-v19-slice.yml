name: FOTON V19 Slice Probe

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v19/**'
      - '.github/workflows/foton-v19-slice.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Probe slicing API
        run: |
          export PYTHONPATH="$PWD/foton-v18:$PYTHONPATH"
          python foton-v19/slice_api_probe_v19.py
      - name: Reduce exact T1 strip memory with internal slicing
        run: |
          export PYTHONPATH="$PWD/foton-v18:$PYTHONPATH"
          python foton-v19/slice_reduce_v19.py
