name: FOTON V30 Global Phase Kickback

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v30/**'
      - '.github/workflows/foton-v30.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python foton-v30/phase_kickback_v30.py
