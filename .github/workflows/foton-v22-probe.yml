name: FOTON V22 Quimb Probe
on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v22/**'
      - '.github/workflows/foton-v22-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q numpy scipy quimb cotengra
      - run: |
          export PYTHONPATH="$PWD/foton-v20:$PYTHONPATH"
          python foton-v22/sigma_sparse_zipup_v22.py
