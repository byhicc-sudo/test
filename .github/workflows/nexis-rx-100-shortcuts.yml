name: NEXIS-RX 100 historical winners versus nonce plus one
on:
  push:
    branches: [nexis-rx-historical100-20261102]
    paths: [.github/workflows/nexis-rx-100-shortcuts.yml, nexis_rx_hist100/shortcut.cpp]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download 100 independently validated historical RandomX hashes
        uses: actions/download-artifact@v4
        with:
          name: NEXIS_RX_100_EXACT_RANDOMX_POW
          repository: byhicc-sudo/test
          run-id: 41355345515
          github-token: ${{ github.token }}
          path: input
      - name: Rebuild pinned official RandomX and native C++ counterfactual tester
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-dev libssl-dev >/dev/null
          PIN=102f8acf90a7649ada410de5499a7ec62e49e1da
          git clone -q https://github.com/tevador/RandomX.git upstream
          git -C upstream checkout -q "$PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCH=native
          cmake --build build --target randomx -j 2
          g++ -std=c++17 -O3 -Wall -Wextra -Iupstream/src nexis_rx_hist100/shortcut.cpp build/librandomx.a -lcrypto -pthread -o nexis_shortcut
      - name: Test simple predictors against all 100 genuine winning jobs
        run: |
          set -euo pipefail
          mkdir -p output
          SEED=ede5e439528eee8366e06971e881221d3ff12a0b76152e4c462ca0642dce732d
          ./nexis_shortcut input/computed100.csv "$SEED" output/winner_versus_nonce_plus_one.csv | tee output/SUMMARY.txt
          test "$(wc -l < output/winner_versus_nonce_plus_one.csv)" = 101
          sha256sum output/winner_versus_nonce_plus_one.csv | tee output/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXIS_RX_HIST100_SIMPLE_ALGORITHM_TESTS
          path: output/
          if-no-files-found: ignore
