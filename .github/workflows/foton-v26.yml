name: FOTON V26 Remote Audit

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v26/**'
      - '.github/workflows/foton-v26.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tensor stack
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Decode and verify V26
        run: |
          base64 -d foton-v26/FOTON_40LZ_PREMEASURE_V26.zip.b64 > /tmp/v26.zip
          echo "c567c734c917be9b1974d3528d51479ee3a5543c7c7fb4029431fb016ed22aa6  /tmp/v26.zip" | sha256sum -c -
          rm -rf /tmp/v26
          mkdir -p /tmp/v26
          unzip -q /tmp/v26.zip -d /tmp/v26
          cd /tmp/v26/FOTON_40LZ_PREMEASURE_V26
          python -m py_compile *.py
      - name: Exact reversible basis audit
        run: |
          cd /tmp/v26/FOTON_40LZ_PREMEASURE_V26
          python foton_40lz_core_v26.py
      - name: Layout audit
        run: |
          cd /tmp/v26/FOTON_40LZ_PREMEASURE_V26
          python foton_40lz_layout_v26.py
      - name: 1875-site 44-rail MPS initialization
        run: |
          cd /tmp/v26/FOTON_40LZ_PREMEASURE_V26
          python foton_40lz_mps_v26.py --iterations 0 --max-bond 64 --cutoff 1e-14 --seed 40
      - name: First 100 real V26 oracle gates
        run: |
          cd /tmp/v26/FOTON_40LZ_PREMEASURE_V26
          python - <<'PY'
          import time, numpy as np
          import quimb.tensor as qtn
          import foton_40lz_layout_v26 as L
          import foton_40lz_mps_v26 as M
          LIMIT=100; MB=64; CO=1e-14
          c,EX12,NON,A,B,PHW,ws,cb,mr,ph=L.build(optimize=True, measured_prefix52=0x549087dac0213)
          _,pos=L.load_pos(c.next)
          free=[int(pos[q]) for q in (EX12+NON)]
          psi=qtn.MPS_computational_state('0'*c.next)
          for q in free: M.g1(psi,M.H,q,MB,CO)
          t0=time.time(); n=0; done=False
          for gs,rev in L.full_segments(cb,mr,ph):
              it=reversed(gs) if rev else iter(gs)
              for g in it:
                  M.gate(psi,L.remap_gate(g,pos),MB,CO)
                  n += 1
                  if n % 10 == 0:
                      print(f'PROBE gate={n} max_bond={max(psi.bond_sizes() or [1])} elapsed={time.time()-t0:.3f}',flush=True)
                  if n>=LIMIT:
                      done=True
                      break
              if done: break
          norm=float(np.real(psi.norm()))
          print('PROBE_GATES',n,flush=True)
          print('PROBE_MAX_BOND',max(psi.bond_sizes() or [1]),flush=True)
          print('PROBE_NORM',format(norm,'.16g'),flush=True)
          print('PROBE_SECONDS',time.time()-t0,flush=True)
          assert abs(norm-1.0)<1e-9
          print('V26_REAL_ORACLE_PROBE=PASS',flush=True)
          PY
