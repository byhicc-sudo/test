name: FOTON V26 Round6 Latent

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v26/**'
      - '.github/workflows/foton-v26.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy scipy quimb cotengra
      - run: python foton-v26/round6_latent_v26.py
