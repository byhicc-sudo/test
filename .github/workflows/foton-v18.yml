name: FOTON V18 Exact TN

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v18/**'
      - '.github/workflows/foton-v18.yml'
  workflow_dispatch:

jobs:
  exact-tn:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Exact 32-bit reversible adder MPO
        run: python foton-v18/exact_adder_mpo_v18.py
      - name: Exact bounded multi-source MPOs
        run: python foton-v18/multisource_mpo_v18.py
      - name: Exact basis-sliced SHA round and schedule tensor audit
        run: python foton-v18/foton_v18_sliced_audit.py --tests 16 --opt greedy
