name: FOTON V18 Exact MPO

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v18/**'
      - '.github/workflows/foton-v18.yml'
  workflow_dispatch:

jobs:
  exact-mpo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Run exact 32-bit reversible adder MPO
        run: python foton-v18/exact_adder_mpo_v18.py
