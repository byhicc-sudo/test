name: FOTON V23 96-Rail Bond Probe

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v23/**'
      - '.github/workflows/foton-v23.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Run fast 96-rail round0-7 bond probe
        run: python foton-v23/job96_bond_probe_v23_fast.py
