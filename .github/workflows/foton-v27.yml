name: FOTON V27 Round7 Latent

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v27/**'
      - '.github/workflows/foton-v27.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python foton-v27/round7_latent_v27.py
