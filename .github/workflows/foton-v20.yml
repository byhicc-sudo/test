name: FOTON V20 Sparse Sigma Trellis

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v20/**'
      - '.github/workflows/foton-v20.yml'
  workflow_dispatch:

jobs:
  trellis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tensor stack
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Run exact sparse Sigma trellis audit
        run: python foton-v20/sigma_sparse_trellis_v20.py
      - name: Build exact Sigma MPS directly from trellis
        run: |
          export PYTHONPATH="$PWD/foton-v20:$PYTHONPATH"
          python foton-v20/sigma_direct_mps_v20.py
