name: FOTON V19 ChMaj Coherent

on:
  push:
    branches: [foton-v15-runner]
    paths:
      - 'foton-v19/ch_maj_coherent_v19.py'
      - '.github/workflows/foton-v19-chmaj.yml'
  workflow_dispatch:

jobs:
  chmaj:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q numpy scipy quimb cotengra
      - name: Run coherent Ch Maj test
        run: python foton-v19/ch_maj_coherent_v19.py
